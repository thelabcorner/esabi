name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate ABI and exports
        shell: pwsh
        run: ./tests/run.ps1

      - name: Configure CMake package
        run: cmake -S . -B build -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install"

      - name: Install CMake package
        run: cmake --install build

      - name: Configure installed-package consumer
        run: cmake -S tests/cmake-consumer -B consumer-build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install"

      - name: Build installed-package consumer
        run: cmake --build consumer-build --config Release

      - name: Run installed-package consumers
        shell: pwsh
        run: |
          ./consumer-build/Release/esabi_c_consumer.exe
          ./consumer-build/Release/esabi_cpp_consumer.exe
